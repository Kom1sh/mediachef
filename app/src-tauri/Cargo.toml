[package]
name = "mediachef"
version = "0.1.0"
description = "FFmpeg for humans + local transcription"
authors = ["MediaChef contributors"]
edition = "2021"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mediachef_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Free-space check before a job starts (wave 3 / T4). Declared here with the
# settings work because both land in the same enqueue path.
fs2 = "0.4"
# Язык операционной системы для настройки «как в системе». Webview его знает
# ненадёжно: на macOS WKWebView сообщает локаль приложения, а не системы, и у
# нелокализованной сборки это всегда en-US — то есть «как в системе» молча
# означало бы «английский» на любой машине.
sys-locale = "0.3"
mediachef-core = { path = "../core" }

[dev-dependencies]
# Queue tests plan real output paths, so they need a real (throwaway) directory.
tempfile = "3"

