[package]
name = "mediachef"
version = "0.1.0"
description = "FFmpeg for humans + local transcription"
authors = ["MediaChef contributors"]
edition = "2021"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mediachef_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# Обновление на месте: без него вся установленная база замерзает на той версии,
# которую скачала, и каждый релиз — это новый поход за теми же людьми.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Free-space check before a job starts (wave 3 / T4). Declared here with the
# settings work because both land in the same enqueue path.
fs2 = "0.4"
# Язык операционной системы для настройки «как в системе». Webview его знает
# ненадёжно: на macOS WKWebView сообщает локаль приложения, а не системы, и у
# нелокализованной сборки это всегда en-US — то есть «как в системе» молча
# означало бы «английский» на любой машине.
sys-locale = "0.3"
# --- Диктовка (волна 5.1) ---
# Глобальный хоткей: ловится, когда впереди чужое приложение, иначе вся затея
# бессмысленна. Плагин отдаёт и нажатие, и отпускание, на чём в 5.2 строится
# различение удержания и переключателя.
tauri-plugin-global-shortcut = "2.3.2"
# Буфер обмена — единственный способ доставки на macOS: разрешение
# «Универсальный доступ» для автовставки не держится у неподписанного
# приложения, а Developer ID покупать не будем.
tauri-plugin-clipboard-manager = "2.3.3"
# Захват с микрофона напрямую, а не запуском ffmpeg на устройство: ffmpeg
# стартует три-четыре сотни миллисекунд, и при удержании клавиши это ровно
# первое слово фразы. Плюс индикатор микрофона в строке меню горит только на
# время записи, а не всё время жизни процесса.
cpal = "0.18.2"
# Запись WAV. Ресемпл в 16 кГц моно делает существующий шаг ffmpeg внутри
# run_whisper — своего DSP в тракте не заводим.
hound = "3.5.1"
# Запись микрофона живёт во временной папке и уносится вместе с ней: на диск
# пользователя надиктованное не попадает. Раньше был только dev-зависимостью.
tempfile = "3"
mediachef-core = { path = "../core" }

[dev-dependencies]

