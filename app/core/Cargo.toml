[package]
name = "mediachef-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "1"
shell-words = "1"
include_dir = "0.7"
ureq = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"
required-features = []
