# Отдельный воркер ровно для одного: письмо о новом сообщении из формы
# обратной связи.
#
# Отдельный — потому что у Pages нет привязки `send_email`, она есть только у
# Workers. Сайт зовёт этот воркер через service binding (`NOTIFY` в
# ../wrangler.toml), и больше его не зовёт никто: публичного адреса у него нет
# (`workers_dev = false`, маршрутов нет), так что снаружи отправить письмо от
# имени формы нельзя.
#
# Письмо уходит на подтверждённый адрес Email Routing — это бесплатно на любом
# тарифе. Сам адрес в репозиторий не записан: он лежит секретом NOTIFY_TO,
# поставить или сменить —
#   cd site/notify && npx wrangler secret put NOTIFY_TO
# Адрес обязан быть среди подтверждённых в Email Routing, иначе отправка падает.
name = "mediachef-notify"
main = "worker.js"
compatibility_date = "2026-09-14"
workers_dev = false
preview_urls = false

# Без `destination_address`: получатель берётся из секрета, а не из файла,
# который лежит в открытом репозитории.
[[send_email]]
name = "MAIL"
