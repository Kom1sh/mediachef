# Конфигурация Pages-проекта. Появилась ради одной вещи — привязки базы D1 к
# воркеру: `_worker.js` получает её как `env.CRAWLERS` и пишет туда заходы
# роботов. Без этого файла привязку пришлось бы держать только в панели
# Cloudflare, то есть в месте, которого нет в репозитории: при пересоздании
# проекта или у второго человека логи молча перестали бы писаться.
#
# `pages_build_output_dir` — обязательный ключ, он же признак того, что это
# конфиг Pages, а не Worker. Из-за него `wrangler pages deploy` больше не
# принимает каталог позиционным аргументом — команда выкладки в package.json
# соответственно укорочена.
name = "mediachef"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-07"

# Одна база на прод и превью намеренно. Превью-выкладок у нас не бывает
# (деплой всегда в main), а вторая база означала бы вторую схему, которую
# кто-нибудь однажды забудет обновить.
[[d1_databases]]
binding = "CRAWLERS"
database_name = "mediachef-crawlers"
database_id = "256268cb-5b23-4c34-87dc-738b057cc141"
