name: release
# Собирает поставки под все три ОС на родных раннерах и прикладывает их
# к GitHub Release тега. Запуск: push тега v* или вручную (workflow_dispatch).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Every job has the same three-part shape around its build:
#   1. sidecars — restore cache, run the platform's fetch script, save cache.
#      This is a BUILD prerequisite, not a packaging step: `bundle.externalBin`
#      makes tauri-build fail with "resource path ... doesn't exist" whenever
#      app/src-tauri/binaries/<bin>-<triple>[.exe] is missing, so nothing can be
#      compiled before the engines are on disk.
#   2. tauri build.
#   3. sidecar self-check — run the engines out of the built artifact, which is
#      the only place that proves the whole chain: externalBin copied them in,
#      the triple suffix got stripped, the exec bit survived, and they start.
# The restore/save split (rather than the combined actions/cache) is deliberate:
# the combined action saves from a job-end hook that fires only when the whole
# job is green, so one later red step would throw away a 2-4 min whisper build
# and refetch on every attempt until the job recovers. Long version of the same
# reasoning lives in ci.yml.
jobs:
  # Пять секунд вместо двадцати минут. `createUpdaterArtifacts: true` требует
  # приватный ключ подписи, и без него tauri build падает — но падает в конце
  # сборки, уже после того как раннер собрал ffmpeg и whisper. Здесь мы узнаём
  # об этом сразу и словами, из которых понятно, что чинить.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: ключ подписи обновлений на месте
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::нет секрета TAURI_SIGNING_PRIVATE_KEY."
            echo "::error::Без него сборка с createUpdaterArtifacts не подпишет пакеты и упадёт."
            echo "::error::Положить: gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.tauri/mediachef.key"
            exit 1
          fi
          echo "ключ на месте"

  macos:
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: cd app && npm ci
      # Script and cache key are byte-identical to the ci.yml rust-tauri job's,
      # so both workflows share one cache entry: a release cut right after a
      # green CI run downloads nothing and rebuilds nothing.
      - uses: actions/cache/restore@v4
        id: sidecars
        with:
          path: app/src-tauri/binaries
          key: sidecars-aarch64-apple-darwin-${{ hashFiles('scripts/fetch-sidecars.sh') }}
      # Near-instant on a cache hit — it re-verifies the pinned sha256s and that
      # nothing links outside /usr/lib and /System, then exits without work.
      - run: ./scripts/fetch-sidecars.sh
      - uses: actions/cache/save@v4
        if: steps.sidecars.outputs.cache-hit != 'true'
        with:
          path: app/src-tauri/binaries
          key: sidecars-aarch64-apple-darwin-${{ hashFiles('scripts/fetch-sidecars.sh') }}
      # Ключ подписи обновлений: с ним рядом с .app появляется MediaChef.app.tar.gz
      # и его .sig — то, что скачает и проверит апдейтер у уже установленных копий.
      - run: cd app && npm run tauri build -- --bundles app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: sidecar self-check (inside MediaChef.app)
        run: |
          # `${out%%$'\n'*}` keeps the first line without a pipe: the default
          # shell here is `bash -eo pipefail`, where `... | head -1` can fail the
          # step on SIGPIPE instead of reporting the version.
          check_dir() {
            local dir="$1" root="$2" b out
            [ -d "$dir" ] || {
              echo "::error::no $dir inside the artifact — bundle layout changed?"
              find "$root" -maxdepth 4 -type f | head -40 || true
              exit 1
            }
            for b in ffmpeg ffprobe whisper-cli; do
              test -x "$dir/$b" || {
                echo "::error::$dir/$b is missing or not executable"
                ls -la "$dir"
                exit 1
              }
            done
            out=$("$dir/ffmpeg" -version);  echo "  ffmpeg:      ${out%%$'\n'*}"
            out=$("$dir/ffprobe" -version); echo "  ffprobe:     ${out%%$'\n'*}"
            # whisper-cli has no -version and prints its usage to stderr; the
            # exit code is the signal we want, not 60 lines of help.
            "$dir/whisper-cli" --help >/dev/null 2>&1
            echo "  whisper-cli: --help ok"
          }
          APP=target/release/bundle/macos/MediaChef.app
          check_dir "$APP/Contents/MacOS" "$APP"
      # NOTICE.md rides INSIDE both archives, next to the instruction file: the
      # .app carries GPL ffmpeg/ffprobe builds, and the licences plus the pointers
      # to their sources have to travel with the binaries rather than only live in
      # the repository. It is also uploaded as a loose asset below.
      - name: package zip + dmg (инструкция и NOTICE внутри)
        run: |
          VER=$(python3 -c "import json;print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])")
          mkdir -p out/dmg-stage
          cp -R target/release/bundle/macos/MediaChef.app out/dmg-stage/
          cp docs/КАК_ОТКРЫТЬ.txt NOTICE.md out/dmg-stage/
          ln -s /Applications out/dmg-stage/Applications
          hdiutil create -volname "MediaChef ${VER}" -srcfolder out/dmg-stage -ov -format UDZO "out/MediaChef_${VER}_aarch64.dmg"
          cp -R target/release/bundle/macos/MediaChef.app out/ && cp docs/КАК_ОТКРЫТЬ.txt NOTICE.md out/
          (cd out && zip -qry "MediaChef-${VER}-macos-arm64.zip" MediaChef.app КАК_ОТКРЫТЬ.txt NOTICE.md)
          cp docs/КАК_ОТКРЫТЬ.txt out/HOW_TO_OPEN_macos.txt
      # Only THIS job uploads the loose NOTICE.md: release assets are per-release,
      # so one upload makes it visible to every platform's downloaders — while
      # three jobs racing on one asset name can 422 (the action deletes the
      # existing asset, then uploads; an interleave hits "already_exists"). The
      # mac archives also carry the notice internally; this asset is what puts
      # it on the release page for the deb/AppImage/NSIS downloads.
      - uses: softprops/action-gh-release@v2
        with:
          # rc-теги публикуются как pre-release: первый прогон нового workflow
          # обкатывается на выбрасываемом релизе, не пугая пользователей.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          # Тело релиза пишет только эта job (как и loose NOTICE.md — один
          # писатель, без гонок). Файл версионируется вместе с тегом: что лежит
          # в docs/RELEASE_NOTES.md тегнутого коммита, то и есть ноты релиза.
          body_path: docs/RELEASE_NOTES.md
          files: |
            out/*.dmg
            out/*.zip
            out/HOW_TO_OPEN_macos.txt
            NOTICE.md
            target/release/bundle/macos/MediaChef.app.tar.gz
      # Подпись едет в latest.json, а не в релиз отдельным файлом: апдейтер читает
      # её из манифеста, и лишний .sig на странице релиза только сбивал бы с толку.
      - uses: actions/upload-artifact@v4
        with:
          name: sig-darwin-aarch64
          path: target/release/bundle/macos/MediaChef.app.tar.gz.sig
          if-no-files-found: error

  linux:
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: system deps (tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf
      - run: cd app && npm ci
      # After the apt step on purpose: the whisper build needs the g++ that
      # build-essential brings.
      - uses: actions/cache/restore@v4
        id: sidecars
        with:
          path: app/src-tauri/binaries
          key: sidecars-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/fetch-sidecars-linux.sh') }}
      # Near-instant on a cache hit — it re-verifies the pinned sha256s and that
      # ldd shows nothing outside the base system set, then exits without work.
      - run: ./scripts/fetch-sidecars-linux.sh
      - uses: actions/cache/save@v4
        if: steps.sidecars.outputs.cache-hit != 'true'
        with:
          path: app/src-tauri/binaries
          key: sidecars-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/fetch-sidecars-linux.sh') }}
      - run: cd app && npm run tauri build -- --bundles deb,appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Both artifacts, because they carry the engines by different mechanisms:
      # the AppImage packs them into its squashfs, the deb into /usr/bin.
      # `--appimage-extract` needs no FUSE, and `dpkg -x` needs no root.
      - name: sidecar self-check (extracted AppImage and deb)
        run: |
          check_dir() {
            local dir="$1" root="$2" b out
            [ -d "$dir" ] || {
              echo "::error::no $dir inside the artifact — bundle layout changed?"
              find "$root" -maxdepth 4 -type f | head -40 || true
              exit 1
            }
            for b in ffmpeg ffprobe whisper-cli; do
              test -x "$dir/$b" || {
                echo "::error::$dir/$b is missing or not executable"
                ls -la "$dir"
                exit 1
              }
            done
            out=$("$dir/ffmpeg" -version);  echo "  ffmpeg:      ${out%%$'\n'*}"
            out=$("$dir/ffprobe" -version); echo "  ffprobe:     ${out%%$'\n'*}"
            "$dir/whisper-cli" --help >/dev/null 2>&1
            echo "  whisper-cli: --help ok"
          }
          # Unpacked outside the checkout: the extracted copies are ~400MB and
          # have no business sitting next to the artifacts we upload.
          SELF="$RUNNER_TEMP/selfcheck"
          rm -rf "$SELF" && mkdir -p "$SELF/appimage" "$SELF/deb"
          cp target/release/bundle/appimage/*.AppImage "$SELF/appimage/MediaChef.AppImage"
          chmod +x "$SELF/appimage/MediaChef.AppImage"
          # --appimage-extract unpacks into the current directory, hence the cd.
          (cd "$SELF/appimage" && ./MediaChef.AppImage --appimage-extract >/dev/null)
          echo "AppImage:"
          check_dir "$SELF/appimage/squashfs-root/usr/bin" "$SELF/appimage/squashfs-root"
          dpkg -x target/release/bundle/deb/*.deb "$SELF/deb"
          echo "deb:"
          check_dir "$SELF/deb/usr/bin" "$SELF/deb"
      - run: mkdir -p out && cp docs/КАК_ЗАПУСТИТЬ_LINUX.txt out/HOW_TO_RUN_linux.txt
      - uses: softprops/action-gh-release@v2
        with:
          # rc-теги публикуются как pre-release: первый прогон нового workflow
          # обкатывается на выбрасываемом релизе, не пугая пользователей.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            out/HOW_TO_RUN_linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sig-linux-x86_64
          path: target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  windows:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: cd app && npm ci
      - uses: actions/cache/restore@v4
        id: sidecars
        with:
          path: app/src-tauri/binaries
          key: sidecars-x86_64-pc-windows-msvc-${{ hashFiles('scripts/fetch-sidecars-windows.ps1') }}
      # Near-instant on a cache hit — it re-verifies the pinned sha256s and that
      # whisper-cli.exe imports no VC redist DLL, then exits without work.
      - run: ./scripts/fetch-sidecars-windows.ps1
        shell: pwsh
      - uses: actions/cache/save@v4
        if: steps.sidecars.outputs.cache-hit != 'true'
        with:
          path: app/src-tauri/binaries
          key: sidecars-x86_64-pc-windows-msvc-${{ hashFiles('scripts/fetch-sidecars-windows.ps1') }}
      - run: cd app && npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # target/release is where externalBin lands next to mediachef.exe, and it
      # is the same layout the NSIS installer copies into Program Files — so it
      # is what the user gets, without installing the installer on the runner.
      - name: sidecar self-check (target/release layout next to mediachef.exe)
        shell: pwsh
        run: |
          $dir = 'target/release'
          foreach ($n in 'mediachef', 'ffmpeg', 'ffprobe', 'whisper-cli') {
            $exe = Join-Path $dir "$n.exe"
            if (-not (Test-Path $exe) -or (Get-Item $exe).Length -eq 0) {
              Get-ChildItem $dir -File | Format-Table Name, Length | Out-String | Write-Host
              throw "$exe is missing or empty"
            }
          }
          $out = & (Join-Path $dir 'ffmpeg.exe') -version
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg -version exited $LASTEXITCODE" }
          Write-Host "  ffmpeg:      $(@($out)[0])"
          $out = & (Join-Path $dir 'ffprobe.exe') -version
          if ($LASTEXITCODE -ne 0) { throw "ffprobe -version exited $LASTEXITCODE" }
          Write-Host "  ffprobe:     $(@($out)[0])"
          # No -version in whisper-cli; --help exits 0 and that is the signal.
          & (Join-Path $dir 'whisper-cli.exe') --help > $null
          if ($LASTEXITCODE -ne 0) { throw "whisper-cli --help exited $LASTEXITCODE" }
          Write-Host "  whisper-cli: --help ok"
      # bash, not cmd: in cmd `;` is a token separator, so `mkdir out; copy a b`
      # parsed as a single mkdir with four operands — it failed on the existing
      # path (red step) and the copy never ran, leaving the upload glob below
      # matching nothing. Git bash also passes the Cyrillic filename through as
      # UTF-8 instead of the console's OEM codepage, and it makes this step read
      # exactly like its macOS and Linux counterparts.
      - run: mkdir -p out && cp docs/КАК_ЗАПУСТИТЬ_WINDOWS.txt out/HOW_TO_RUN_windows.txt
        shell: bash
      # Портативная поставка: та же четвёрка файлов, что кладёт в Program Files
      # установщик, только без него. Нужна двоим — Scoop распаковывает и обновляет
      # именно её, и человеку, которому SmartScreen не даёт запустить неподписанный
      # инсталлятор: распакованный exe он хотя бы может пустить руками.
      #
      # Файлы перечислены поимённо, а не собраны шаблоном по target/release:
      # там же лежат deps/, build/ и .pdb, и архив вырос бы до гигабайта.
      - name: portable zip
        shell: pwsh
        run: |
          $ver = (Get-Content app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $stage = 'out/portable/MediaChef'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($n in 'mediachef', 'ffmpeg', 'ffprobe', 'whisper-cli') {
            Copy-Item "target/release/$n.exe" $stage
          }
          Copy-Item docs/КАК_ЗАПУСТИТЬ_WINDOWS.txt "$stage/HOW_TO_RUN.txt"
          Copy-Item NOTICE.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "out/MediaChef-$ver-windows-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          # rc-теги публикуются как pre-release: первый прогон нового workflow
          # обкатывается на выбрасываемом релизе, не пугая пользователей.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            target/release/bundle/nsis/*.exe
            out/*.zip
            out/HOW_TO_RUN_windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sig-windows-x86_64
          path: target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  # Манифест обновления. Собирается последним, когда все три сборки уже положили
  # свои пакеты в релиз: latest.json ссылается на них по адресу, и появиться он
  # должен после того, на что ссылается, а не до.
  #
  # Апдейтер в приложении смотрит на .../releases/latest/download/latest.json.
  # GitHub отдаёт по этому адресу последний НЕ-предварительный релиз, поэтому
  # rc-теги, помеченные выше как prerelease, до пользователей не доезжают — их
  # манифест лежит на своей странице и виден только тому, кто туда придёт.
  updater:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: sigs
          pattern: sig-*
      - name: собрать latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: python3 scripts/make-latest-json.py
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: latest.json
