name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: cargo fmt --check
      - run: cargo clippy -p mediachef-core -- -D warnings
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ./fixtures/make.sh
      - run: cargo test -p mediachef-core
      - run: cargo run -p mediachef-core --bin smoke

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: cd app && npm ci
      - run: cd app && npm run typecheck
      - run: cd app && npm test
