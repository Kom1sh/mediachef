name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: cargo fmt --check
      - run: cargo clippy -p mediachef-core -- -D warnings
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ./fixtures/make.sh
      - run: cargo test -p mediachef-core
      - run: cargo run -p mediachef-core --bin smoke

  # The tauri crate builds only where its webview toolkit does: macOS needs no
  # extra system packages, Linux would need webkit2gtk. No ffmpeg here — the
  # queue tests inject a fake runner instead of spawning one.
  rust-tauri:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy" }
      - run: cargo test --manifest-path app/src-tauri/Cargo.toml
      - run: cargo clippy -p mediachef -- -D warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: cd app && npm ci
      - run: cd app && npm run typecheck
      - run: cd app && npm test
