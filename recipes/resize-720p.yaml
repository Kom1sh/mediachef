  zh: "缩放到 720p 高度并保持比例。"
input: {types: [video]}
params: []
engine: ffmpeg
args: ["-i", "{input}", "-vf", "scale=-2:720", "-c:v", "libx264", "-crf", "23", "-preset", "veryfast", "-c:a", "copy", "{output}"]
output: {ext: mp4, suffix: 720p}
seo: {slug: resize-video-720p, priority: medium}
