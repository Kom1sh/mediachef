aliases:
  en: [resize video, 720p, downscale]
  ru: [уменьшить разрешение, видео в 720п, даунскейл]
  es: ["cambiar el tamaño del vídeo", "vídeo a 720p", "bajar la resolución"]
  pt: ["redimensionar vídeo", "vídeo para 720p", "baixar a resolução"]
  fr: ["redimensionner une vidéo", "vidéo en 720p", "baisser la résolution"]
