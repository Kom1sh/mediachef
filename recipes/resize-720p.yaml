id: resize-720p
category: geometry
title: {en: "Resize video to 720p", ru: "Уменьшить видео до 720p"}
aliases:
  en: [resize video, 720p, downscale]
  ru: [уменьшить разрешение, видео в 720п, даунскейл]
description: {en: "Scales to 720p height keeping aspect ratio.", ru: "Масштабирует до высоты 720p с сохранением пропорций."}
input: {types: [video]}
params: []
engine: ffmpeg
args: ["-i", "{input}", "-vf", "scale=-2:720", "-c:v", "libx264", "-crf", "23", "-preset", "veryfast", "-c:a", "copy", "{output}"]
output: {ext: mp4, suffix: 720p}
seo: {slug: resize-video-720p, priority: medium}
