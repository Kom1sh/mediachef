description:
  en: "Scales to 720p height keeping aspect ratio."
  ru: "Масштабирует до высоты 720p с сохранением пропорций."
  es: "Escala a 720p de altura manteniendo la proporción."
  pt: "Redimensiona para 720p de altura mantendo a proporção."
  fr: "Met à l'échelle en 720p de hauteur en gardant les proportions."
  de: "Skaliert auf 720p Höhe und behält das Seitenverhältnis."
  pl: "Skaluje do wysokości 720p z zachowaniem proporcji."
  it: "Scala a 720p di altezza mantenendo le proporzioni."
