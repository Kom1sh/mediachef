  pt: "Entra qualquer idioma, sai texto em inglês — uma passagem, localmente (Whisper)."
  fr: "N'importe quelle langue en entrée, du texte anglais en sortie — une passe, en local (Whisper)."
  de: "Beliebige Sprache hinein, englischer Text heraus — ein Durchgang, lokal (Whisper)."
  pl: "Na wejściu dowolny język, na wyjściu tekst angielski — jeden przebieg, lokalnie (Whisper)."
  it: "Qualsiasi lingua in ingresso, testo inglese in uscita — un passaggio, in locale (Whisper)."
  ar: "أي لغة تدخل، ويخرج نص إنجليزي — مرور واحد، محلياً (Whisper)."
