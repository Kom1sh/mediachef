description:
  en: "Run any FFmpeg arguments. {input} and {output} are substituted."
  ru: "Любые аргументы FFmpeg. {input} и {output} подставляются."
  es: "Ejecuta cualquier argumento de FFmpeg. {input} y {output} se sustituyen."
  pt: "Executa quaisquer argumentos do FFmpeg. {input} e {output} são substituídos."
  fr: "Exécute n'importe quels arguments FFmpeg. {input} et {output} sont substitués."
  de: "Führt beliebige FFmpeg-Argumente aus. {input} und {output} werden eingesetzt."
  pl: "Uruchamia dowolne argumenty FFmpeg. {input} i {output} są podstawiane."
  it: "Esegue qualsiasi argomento di FFmpeg. {input} e {output} vengono sostituiti."
  ar: "ينفّذ أي معاملات لـ FFmpeg. يُستبدل {input} و{output}."
  zh: "运行任意 FFmpeg 参数。{input} 和 {output} 会被替换。"
input: {types: [any]}
params:
  # Wave 1 always writes .mp4 here (`output.ext` below). A user-chosen output
  # extension needs plan_output to honour it — wave 3 re-adds the param wired.
  - {key: cmd, type: string, default: "-i {input} -c copy {output}", label: {en: Arguments, ru: Аргументы, es: "Argumentos", pt: "Argumentos", fr: "Arguments", de: "Argumente", pl: "Argumenty", it: "Argomenti", ar: "المعاملات", zh: "参数"}}
engine: ffmpeg
args: ["{cmd:split}"]
output: {ext: mp4, suffix: custom}
seo: {slug: custom-ffmpeg-command, priority: low}
