  - {key: language, type: language, default: "auto", label: {en: "Source language", ru: "Язык источника", es: "Idioma de origen", pt: "Idioma de origem", fr: "Langue source", de: "Ausgangssprache", pl: "Język źródłowy", it: "Lingua di partenza", ar: "لغة المصدر", zh: "源语言"}}
engine: whisper
args: []
whisper: {translate: true}
