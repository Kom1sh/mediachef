description:
  en: "Any language in, timed English SRT out — one pass, locally (Whisper)."
  ru: "На входе любой язык, на выходе английский SRT с таймингами — за один проход, локально (Whisper)."
  es: "Entra cualquier idioma, sale un SRT en inglés con tiempos — una pasada, en local (Whisper)."
  pt: "Entra qualquer idioma, sai um SRT em inglês com tempos — uma passagem, localmente (Whisper)."
  fr: "N'importe quelle langue en entrée, un SRT anglais minuté en sortie — une passe, en local (Whisper)."
  de: "Beliebige Sprache hinein, englische SRT mit Zeitmarken heraus — ein Durchgang, lokal (Whisper)."
  pl: "Na wejściu dowolny język, na wyjściu angielski SRT z czasami — jeden przebieg, lokalnie (Whisper)."
  it: "Qualsiasi lingua in ingresso, un SRT inglese con i tempi in uscita — un passaggio, in locale (Whisper)."
  ar: "أي لغة تدخل، ويخرج ملف SRT إنجليزي بتوقيتات — مرور واحد، محلياً (Whisper)."
  zh: "输入任意语言，输出带时间轴的英文 SRT — 一次完成，本地运行（Whisper）。"
