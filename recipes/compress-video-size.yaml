description:
  en: "Works out the bitrate from the video's length so the file fits the size you set — for Discord, Telegram or an email attachment. H.264; when the budget is tight the frame is scaled down."
  ru: "Считает битрейт по длине ролика, чтобы файл влез в заданный размер — для Discord, Telegram или вложения в письмо. H.264; при тесном бюджете кадр уменьшается."
  es: "Calcula el bitrate a partir de la duración para que el archivo quepa en el tamaño indicado: para Discord, Telegram o un adjunto de correo. H.264; si el margen es justo, se reduce el cuadro."
  pt: "Calcula o bitrate pela duração para o arquivo caber no tamanho escolhido — para Discord, Telegram ou anexo de e-mail. H.264; com orçamento apertado, o quadro é reduzido."
  fr: "Calcule le débit d'après la durée pour que le fichier tienne dans la taille choisie — pour Discord, Telegram ou une pièce jointe. H.264 ; si le budget est serré, l'image est réduite."
  de: "Berechnet die Bitrate aus der Länge, damit die Datei in die gewählte Größe passt — für Discord, Telegram oder einen Mailanhang. H.264; bei knappem Budget wird das Bild verkleinert."
  pl: "Liczy bitrate z długości filmu, żeby plik zmieścił się w zadanym rozmiarze — na Discorda, Telegram albo do załącznika. H.264; przy ciasnym budżecie obraz jest zmniejszany."
  it: "Calcola il bitrate dalla durata perché il file stia nella dimensione scelta — per Discord, Telegram o un allegato email. H.264; con un budget stretto il fotogramma viene ridotto."
  ar: "يحسب معدل البت من طول الفيديو ليتسع الملف للحجم الذي تحدده — لديسكورد أو تيليغرام أو مرفق بريد. H.264؛ وعند ضيق الحجم يُصغَّر الإطار."
  zh: "根据视频时长算出码率，让文件装进你设定的大小——发 Discord、Telegram 或作邮件附件都合适。H.264；预算紧时会缩小画面。"
input: {types: [video]}
params:
  - {key: size_mb, type: int, default: 10, min: 1, max: 4000, unit: MB, label: {en: "Target size", ru: "Целевой размер", es: "Tamaño objetivo", pt: "Tamanho alvo", fr: "Taille cible", de: "Zielgröße", pl: "Docelowy rozmiar", it: "Dimensione obiettivo", ar: "الحجم المستهدف", zh: "目标大小"}}
engine: ffmpeg
# Битрейт, буфер, звук и потолок высоты считает очередь из длительности (core/src/fit.rs):
# в шаблоне их нет, это ключи fit::KEYS. Высота — потолок, а не цель: min(ih, …) не растягивает.
fit_size: {param: size_mb, audio_kbps: 128}
args: ["-i", "{input}", "-c:v", "libx264", "-preset", "medium", "-b:v", "{fit_video_bitrate}", "-maxrate", "{fit_video_bitrate}", "-bufsize", "{fit_bufsize}", "-vf", "scale=-2:'trunc(min(ih,{fit_height})/2)*2'", "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "{fit_audio_bitrate}", "-movflags", "+faststart", "{output}"]
output: {ext: mp4, suffix: small}
seo: {slug: compress-video-to-size, priority: high}
